    * {

    body {

      font-family: Tahoma, Arial, sans-serif
    }

    .container {
      max-width: 1500px;
      margin: auto;
      padding: 36px
    }

    .hero {
      background: #fff;
      border: 1px solid #e3e7eb;
      border-radius: 16px;
      padding: 26px 30px;
      margin-bottom: 26px
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 28px
    }

    .hero p {
      margin: 6px 0;
      color: #59636e;
      line-height: 1.8
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(520px, 1fr));
      gap: 22px;
      align-items: start
    }

    .card {
      background: #fff;
      border: 1px solid #dde2e7;
      border-radius: 14px;
      overflow: hidden;
      break-inside: avoid
    }

    .card-head {
      padding: 18px 20px;
      border-bottom: 1px solid #e8ebee
    }

    .card-head h2 {
      direction: ltr;
      text-align: left;
      margin: 0 0 7px;
      font-size: 19px
    }

    .card-head p {
      margin: 0;
      color: #66717c;
      font-size: 13px;
      line-height: 1.7
    }

    .table-wrap {
      overflow-x: auto
    }

    table {
      border-collapse: collapse;
      width: 100%;
      direction: ltr;
      text-align: left;
      font-size: 12px
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #edf0f2;
      white-space: nowrap
    }

    th {
      background: #f8f9fa;
      font-weight: 700
    }

    .field {
      font-weight: 700;
      background: #fbfcfd
    }

    tbody tr:last-child td {
      border-bottom: 0
    }

    .note {
      font-size: 12px;
      color: #737e88;
      margin-top: 14px
    }

    @media(max-width:700px) {
      .container {
        padding: 16px
      }

      .grid {
        grid-template-columns: 1fr
      }

      .card {
        min-width: 0
      }
    }

    @media print {
      body {
        background: #fff
      }

      .container {
        max-width: none;
        padding: 10px
      }

      .grid {
        display: block
      }

      .card {
        margin-bottom: 18px;
        page-break-inside: avoid
      }
    }
  </style>
</head>

    function displayValue(value) {
      if (value === null || value === undefined) return "NULL";
      if (typeof value === "boolean") return value ? "true" : "false";
      return String(value);
    }

    function createTableCard(tableDef) {
      const section = document.createElement("section");
      section.className = "card";

      const header = document.createElement("div");
      header.className = "card-head";

      const title = document.createElement("h2");
      title.textContent = tableDef.name;

      const description = document.createElement("p");
      description.textContent = tableDef.description;

      header.append(title, description);

      const tableWrap = document.createElement("div");
      tableWrap.className = "table-wrap";

      const table = document.createElement("table");
      table.innerHTML = `
    <thead>
      <tr>
        <th>اسم العمود</th>
        <th>مثال 1</th>
        <th>مثال 2</th>
        <th>مثال 3</th>
      </tr>
    </thead>
  `;

      const tbody = document.createElement("tbody");

      Object.entries(tableDef.columns).forEach(([columnName, examples]) => {
        const row = document.createElement("tr");

        const nameCell = document.createElement("td");
        nameCell.className = "field";
        nameCell.textContent = columnName;
        row.appendChild(nameCell);

        examples.forEach(value => {
          const cell = document.createElement("td");
          cell.textContent = displayValue(value);
          row.appendChild(cell);
        });

        tbody.appendChild(row);
      });

      table.appendChild(tbody);
      tableWrap.appendChild(table);
      section.append(header, tableWrap);

      return section;
    }

    const grid = document.getElementById("tablesGrid");
    schemaTables.forEach(tableDef => {
      grid.appendChild(createTableCard(tableDef));
    });
