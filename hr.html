function showValue(value) {
  if (value === null || value === undefined) return "NULL";
  if (typeof value === "boolean") return value ? "true" : "false";
  return String(value);
}

function createCard(def) {
  const card = document.createElement("section");
  card.className = "card";

  const head = document.createElement("div");
  head.className = "card-head";
  head.innerHTML = `<h2>${def.name}</h2><p>${def.description}</p>`;
  card.appendChild(head);

  if (!def.hasExamples) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = `لا توجد أعمدة تفصيلية في المخطط الحالي لعرض أمثلة عليها.<br><span class="badge">ID = INT</span>`;
    card.appendChild(empty);
    return card;
  }

  const wrap = document.createElement("div");
  wrap.className = "table-wrap";

  const table = document.createElement("table");
  table.innerHTML = `
    <thead>
      <tr>
        <th>اسم العمود</th>
        <th>النوع</th>
        <th>مثال 1</th>
        <th>مثال 2</th>
        <th>مثال 3</th>
      </tr>
    </thead>
  `;

  const tbody = document.createElement("tbody");

  Object.entries(def.columns).forEach(([columnName, columnDef]) => {
    const row = document.createElement("tr");

    const nameCell = document.createElement("td");
    nameCell.className = "field";
    nameCell.textContent = columnName;
    row.appendChild(nameCell);

    const typeCell = document.createElement("td");
    typeCell.className = "type";
    typeCell.textContent = columnDef.type;
    row.appendChild(typeCell);

    columnDef.examples.forEach(example => {
      const td = document.createElement("td");
      td.textContent = showValue(example);
      row.appendChild(td);
    });

    tbody.appendChild(row);
  });

  table.appendChild(tbody);
  wrap.appendChild(table);
  card.appendChild(wrap);
  return card;
}

const grid = document.getElementById("tablesGrid");
schemaTables.forEach(def => grid.appendChild(createCard(def)));
