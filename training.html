function displayValue(value) {
  if (value === null || value === undefined) return "NULL";
  if (typeof value === "boolean") return value ? "true" : "false";
  return String(value);
}
function createTableCard(tableDef) {
  const section = document.createElement("section");
  section.className = "card";
  const header = document.createElement("div");
  header.className = "card-head";
  header.innerHTML = `<h2>${tableDef.name}</h2><p>${tableDef.description}</p>`;
  section.appendChild(header);
  const columns = Object.entries(tableDef.columns);
  if (columns.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = `لا توجد أعمدة تفصيلية في المخطط الحالي لعرض أمثلة عليها.<br><span class="badge">ID = INT</span>`;
    section.appendChild(empty);
    return section;
  }
  const wrap = document.createElement("div");
  wrap.className = "table-wrap";
  const table = document.createElement("table");
  table.innerHTML = `<thead><tr><th>اسم العمود</th><th>مثال 1</th><th>مثال 2</th><th>مثال 3</th></tr></thead>`;
  const tbody = document.createElement("tbody");
  columns.forEach(([columnName, examples]) => {
    const row = document.createElement("tr");
    const nameCell = document.createElement("td");
    nameCell.className = "field";
    nameCell.textContent = columnName;
    row.appendChild(nameCell);
    examples.forEach(value => {
      const td = document.createElement("td");
      td.textContent = displayValue(value);
      row.appendChild(td);
    });
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  section.appendChild(wrap);
  return section;
}
const grid = document.getElementById("tablesGrid");
schemaTables.forEach(tableDef => grid.appendChild(createTableCard(tableDef)));
